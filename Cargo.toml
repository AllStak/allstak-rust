[package]
name = "allstak"
version = "0.2.1"
edition = "2021"
rust-version = "1.81"
license = "MIT"
repository = "https://github.com/AllStak/allstak-rust"
homepage = "https://allstak.sa"
description = "Native Rust SDK for AllStak: error monitoring, performance tracing, structured logging, and release-health sessions over the AllStak ingest protocol."
readme = "README.md"
keywords = ["observability", "monitoring", "tracing", "errors", "telemetry"]
categories = ["development-tools::debugging", "web-programming"]
exclude = [".github/", "tests/"]

[features]
default = ["panic"]
panic = []
tracing = ["dep:tracing", "dep:tracing-core", "dep:tracing-subscriber"]
axum = ["dep:axum", "dep:tower", "dep:http", "dep:matchit"]
actix = ["dep:actix-web", "dep:futures-util"]
anyhow = ["dep:anyhow"]
# Outbound HTTP auto-instrumentation: a reqwest-middleware that opens an
# `http.client` child span, injects the active trace context, and emits an
# outbound HttpRequestRecord. Default-off feature, default-on once wired.
reqwest-middleware = ["dep:reqwest-middleware", "dep:async-trait", "dep:http"]
# Database auto-instrumentation: a tracing layer that turns sqlx's own
# `sqlx::query` telemetry into DbQueryRecords tied to the active span. Builds on
# the `tracing` feature; needs no sqlx link (it reads sqlx's tracing events).
sqlx = ["tracing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
backtrace = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }
regex = "1"
once_cell = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Optional / feature-gated integration dependencies.
tracing = { version = "0.1", optional = true }
tracing-core = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
http = { version = "1", optional = true }
matchit = { version = "0.7", optional = true }
actix-web = { version = "4", optional = true }
futures-util = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
# 0.4.x targets reqwest 0.12 (the version this crate already uses); 0.5+ moved
# to reqwest 0.13 and would pull a second copy of reqwest into the graph.
reqwest-middleware = { version = "0.4", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
